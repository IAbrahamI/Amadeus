name: tests

on:
  push:
  pull_request:
  workflow_call:

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Unit tests (no network, no Ollama, no Docker needed)
        working-directory: core
        run: python -m unittest -v
      - name: Python compiles
        run: python -m py_compile core/amadeus_core/*.py core/voice/*.py core/deploy/work-guard.py
      - name: JavaScript parses
        run: for f in core/web/*.js; do node --check "$f"; done
      - name: Shell scripts parse
        run: for f in install.sh core/deploy/install.sh core/deploy/ui.sh core/deploy/bin/* core/desktop-tauri/build.sh packaging/build.sh packaging/build-repos.sh packaging/macos/build.sh packaging/macos/updater-key.sh; do bash -n "$f"; done

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Packages the desktop app builds against
        timeout-minutes: 15
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # its rebuild after installing can stall for a long time
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0"
          for try in 1 2 3; do
            # a stuck try is really stopped (-k, and what it left behind), so the next one doesn't wait for its lock
            if timeout -k 15 240 sudo env DEBIAN_FRONTEND=noninteractive sh -c "apt-get update $APT && apt-get install -y --no-install-recommends $APT libgtk-3-dev libwebkit2gtk-4.1-dev"; then exit 0; fi
            echo "::group::try $try stopped: what was running"; ps -eo pid,etimes,stat,args --sort=etimes | grep -E 'apt|dpkg|http|ldconfig|man|update-' | grep -v grep | cut -c1-150 | tail -15; echo "::endgroup::"
            sudo pkill -9 -x apt-get || true; sudo pkill -9 -f /usr/lib/apt/methods/ || true; sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
      - name: The desktop app compiles
        working-directory: core/desktop-tauri
        run: cargo check --locked

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: core
        run: python -m unittest -v
      - name: The desktop app compiles
        working-directory: core/desktop-tauri
        run: cargo check --locked

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6  # keeps Gradle between runs and retries its download
      - name: Build the phone app
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease --warning-mode all
