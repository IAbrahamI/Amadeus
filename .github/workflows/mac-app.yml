# Builds the Mac app and checks that it starts. The disk image is kept with the run, to try it before it is released.
name: mac-app

on:
  push:
    branches: [main]
    paths: ["core/**", "packaging/macos/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-15  # Apple Silicon: Macs with an M1 or newer are the ones Amadeus supports
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build
        run: packaging/macos/build.sh
      - name: The core starts from inside the app, and keeps its data in the Mac folder
        run: |
          RES="$PWD/dist/macos/Amadeus.app/Contents/Resources"
          export HOME="$(mktemp -d)" PYTHONDONTWRITEBYTECODE=1
          (cd "$RES/core" && "$RES/python/bin/python3" -c "
          import faulthandler, time
          faulthandler.dump_traceback_later(30, exit=True)
          t = time.time()
          from amadeus_core import firstrun
          print('imported', time.time() - t)
          print(firstrun.status(), time.time() - t)
          ") || true
          "$RES/python/bin/python3" "$RES/core/run.py" >core.log 2>&1 &
          PID=$!
          code=""
          for _ in $(seq 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8095/ || true)"
            [ "$code" = 403 ] && break  # (the page only opens in the app's own window)
            sleep 1
          done
          kill "$PID" || true
          cat core.log | tail -20
          [ "$code" = 403 ]
          test -f "$HOME/Library/Application Support/Amadeus/core/token"
          codesign --verify --deep --strict dist/macos/Amadeus.app
      - name: Voice installs on a Mac, and speech goes out and comes back
        timeout-minutes: 15
        run: |
          RES="$PWD/dist/macos/Amadeus.app/Contents/Resources"
          export HOME="$(mktemp -d)" PYTHONDONTWRITEBYTECODE=1
          W="$(mktemp -d)"  # (nothing gets written inside the signed app)
          trap 'echo "--- voice service log"; tail -40 "$W/voice.log" || true' EXIT
          (cd "$RES/core" && "$RES/python/bin/python3" -c "from amadeus_core import firstrun; firstrun._voice(service=False)")
          V="$HOME/Library/Application Support/Amadeus"
          "$V/voice/venv-lite/bin/python" -c "import sounddevice, vosk, faster_whisper, kokoro_onnx; print('voice packages load')"
          "$V/voice/venv-lite/bin/python" -W ignore "$RES/core/voice/voice_server.py" >"$W/voice.log" 2>&1 &
          PID=$!
          T="$(cat "$V/core/token")"
          for _ in $(seq 60); do curl -sf http://127.0.0.1:8896/health >/dev/null && break; sleep 2; done
          curl -sS -m 120 -H "authorization: Bearer $T" -d '{"text":"Please show my calendar for tomorrow.","voice":"kokoro:af_heart"}' http://127.0.0.1:8896/tts -o "$W/said.wav"
          curl -sS -m 180 -H "authorization: Bearer $T" -H 'content-type: audio/wav' --data-binary @"$W/said.wav" http://127.0.0.1:8896/stt | tee "$W/heard.json"
          echo
          kill "$PID" || true
          python3 -c "import json; t = json.load(open('$W/heard.json'))['text'].lower(); assert 'calendar' in t, t"
      - name: Open the real app, and the setup really appears in its window
        timeout-minutes: 6
        run: |
          DATA="$HOME/Library/Application Support/Amadeus/core"
          cp -R dist/macos/Amadeus.app /Applications/
          open /Applications/Amadeus.app
          sleep 60
          screencapture -x first-start.png || true
          launchctl list | grep amadeus || true
          tail -30 "$HOME"/Library/Logs/Amadeus/*.log || true
          T="$(cat "$DATA/token")"
          curl -sS -m 10 -H "authorization: Bearer $T" -w ' %{http_code} %{time_total}s\n' http://127.0.0.1:8095/api/theme || true
          curl -sS -m 40 -H "authorization: Bearer $T" http://127.0.0.1:8095/api/setup -o setup.json -w ' %{http_code} %{time_total}s\n' || sample "$(pgrep -f core/run.py | head -1)" 3 -f sample.txt || true
          cat setup.json || true
          grep -A25 'Call graph' sample.txt | cut -c1-110 || true
          echo
          python3 -c "import json; s = json.load(open('setup.json')); assert s['needed'] and s['ollama'] == 'missing' and s['shown'], s"
      - name: Started before the core answers, the window waits and then signs in
        timeout-minutes: 6
        run: |
          DATA="$HOME/Library/Application Support/Amadeus/core"
          pkill -x amadeus-desktop || true
          launchctl bootout "gui/$(id -u)/com.amadeus.core" || true
          sleep 2
          # the core can't start while something else holds its port, and this answers nothing
          python3 -c "
          import socket, time
          s = socket.socket(); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(('127.0.0.1', 8095)); s.listen(); s.settimeout(0.2)
          end = time.time() + 8
          while time.time() < end:
              try: s.accept()[0].close()
              except OSError: pass
          " &
          sleep 1
          open /Applications/Amadeus.app
          sleep 60
          tail -5 "$HOME/Library/Logs/Amadeus/core.log" || true
          curl -sS -m 20 -H "authorization: Bearer $(cat "$DATA/token")" http://127.0.0.1:8095/api/setup -o setup.json
          python3 -c "import json; s = json.load(open('setup.json')); assert s['needed'] and s['shown'], s"
      - name: Removed from Applications and installed again, it still signs in
        timeout-minutes: 6
        run: |
          DATA="$HOME/Library/Application Support/Amadeus/core"
          pkill -x amadeus-desktop || true
          rm -rf /Applications/Amadeus.app
          sleep 20
          launchctl list | grep amadeus || true
          if pgrep -fl 'core/run.py'; then echo "The core outlived its app"; exit 1; fi
          cp -R dist/macos/Amadeus.app /Applications/
          open /Applications/Amadeus.app
          sleep 45
          tail -5 "$HOME/Library/Logs/Amadeus/core.log" || true
          curl -sS -m 20 -H "authorization: Bearer $(cat "$DATA/token")" http://127.0.0.1:8095/api/setup -o setup.json
          cat setup.json | cut -c1-120; echo
          python3 -c "import json; s = json.load(open('setup.json')); assert s['needed'] and s['shown'], s"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: look
          path: first-start.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: amadeus-macos
          path: dist/macos/*.dmg
          retention-days: 14
          if-no-files-found: error
