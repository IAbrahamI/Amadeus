# Only started by hand: does Hindsight run on a Mac without Docker?
name: try-hindsight
on:
  workflow_dispatch:
    inputs:
      version:
        description: hindsight-api version (empty for the newest)
        required: false
jobs:
  try:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: packaging/macos/try_hindsight.sh
        env:
          HINDSIGHT_VERSION: ${{ inputs.version }}
