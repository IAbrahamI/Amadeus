# A version tag (v1.2.0) builds and publishes a release, only if the tests pass. Started by hand it only builds, so the
# packages can be checked without publishing anything.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-22.04  # the oldest supported: the app then runs on newer systems too
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the VERSION file
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Packages the desktop app builds against
        timeout-minutes: 15
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # its rebuild after installing can stall for a long time
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 -o Dpkg::Use-Pty=0"
          for try in 1 2 3; do
            # a stuck try is really stopped (-k, and what it left behind), so the next one doesn't wait for its lock
            if timeout -k 15 240 sudo env DEBIAN_FRONTEND=noninteractive sh -c "apt-get update $APT && apt-get install -y --no-install-recommends $APT libgtk-3-dev libwebkit2gtk-4.1-dev"; then exit 0; fi
            echo "::group::try $try stopped: what was running"; ps -eo pid,etimes,stat,args --sort=etimes | grep -E 'apt|dpkg|http|ldconfig|man|update-' | grep -v grep | cut -c1-150 | tail -15; echo "::endgroup::"
            sudo pkill -9 -x apt-get || true; sudo pkill -9 -f /usr/lib/apt/methods/ || true; sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
      - name: Build the desktop app
        working-directory: core/desktop-tauri
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.tauri-build/target
        run: cargo build --release --locked
      - name: Build the packages
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          curl -fsSL -o nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  nfpm.tgz" | sha256sum -c -
          sudo tar xzf nfpm.tgz -C /usr/local/bin nfpm
          rm nfpm.tgz
          (umask 077; printf '%s' "$REPO_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/key.asc")
          RPM_KEY="$RUNNER_TEMP/key.asc" NFPM_RPM_PASSPHRASE="$REPO_GPG_PASSPHRASE" packaging/build.sh
          rm -f "$RUNNER_TEMP/key.asc"
      - name: Keep the packages with this run
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/
      - name: Build the signed repositories
        env:
          REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
        run: |
          timeout 300 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dpkg-dev apt-utils createrepo-c
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 --import 3<<<"$REPO_GPG_PASSPHRASE" <<<"$REPO_GPG_PRIVATE_KEY"
          packaging/build-repos.sh
      - name: Check the signatures against the public key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import packaging/amadeus-repo.gpg
          gpg --batch --verify site/apt/dists/stable/Release.gpg site/apt/dists/stable/Release
          gpg --batch --verify site/apt/dists/stable/InRelease
          gpg --batch --verify site/rpm/repodata/repomd.xml.asc site/rpm/repodata/repomd.xml
          for f in site/arch/x86_64/*.sig; do gpg --batch --verify "$f" "${f%.sig}"; done
      - name: Keep the repositories with this run
        uses: actions/upload-artifact@v7
        with:
          name: repositories
          path: site/
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  pages:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repositories
          path: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
