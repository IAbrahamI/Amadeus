[package]
name = "amadeus-desktop"
version = "0.1.0"
edition = "2021"
description = "Amadeus on the desktop: the mini core, the dashboard and the tray"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
resvg = "0.45"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
