<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{name}</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/hud.css">
<script src="/themes.js"></script>
</head>
<body>
<div class="app crt" id="app">
  <nav class="rail" aria-label="Views">
    <div class="mark" data-name-title="{name}"><i></i></div>
    <button class="nav" data-v="home" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg><span class="tip">Home</span></button>
    <button class="nav" data-v="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg><span class="tip">Chat</span></button>
    <button class="nav" data-v="calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15"/><path d="M4 10h16M9 3v4m6-4v4"/></svg><span class="tip">Calendar</span></button>
    <button class="nav" data-v="mail"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="m4 7 8 6 8-6"/></svg><span class="tip">Mail</span></button>
    <button class="nav" data-v="todo"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="m8 12 3 3 5-6"/></svg><span class="n" id="nTodo" hidden></span><span class="tip">ToDo</span></button>
    <button class="nav" data-v="projects"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3z"/></svg><span class="tip">Projects</span></button>
    <button class="nav" data-v="approvals"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="m9 12 2 2 4-4"/></svg><span class="n" id="nAppr" hidden></span><span class="tip">Approvals</span></button>
    <button class="nav" data-v="memory"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/></svg><span class="tip">Memory</span></button>
    <div class="spacer"></div>
    <button class="nav" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M4.9 19.1 7 17m10-10 2.1-2.1"/></svg><span class="tip">Settings</span></button>
  </nav>

  <header class="top">
    <span class="name" data-name>AMADEUS</span>
    <span class="tag" id="tag"><b></b>Core online · local only</span>
    <span class="grow"></span>
    <span class="state" id="state">Idle</span>
    <span class="clock" id="clock">--:--:--</span>
  </header>

  <main class="stage" id="stage">
    <section class="hud tl"><div class="bigtime" id="bigtime">--:--</div><div class="date" id="date"></div></section>
    <section class="hud tr"><h4>Waiting for you</h4>
      <div class="wait"><button data-go="approvals">Approvals <em id="wAppr">0</em></button><button data-go="todo">To-dos <em id="wTodo">0</em></button><button data-go="mail">Unread mail <em id="wMail">–</em></button></div></section>
    <section class="hud bl"><h4>Memory</h4><div class="sys" id="memStats">Loading…</div></section>
    <section class="hud br"><h4>Next up</h4><div class="next" id="nextUp"><span>Nothing planned</span></div></section>

    <div class="ghost" id="ghost" tabindex="0" aria-label="Today's conversation"></div>
    <p class="sub" id="sub" title="Open the conversation"><span class="who" data-name>AMADEUS</span><span id="subText"></span></p>

    <section class="panel" id="panel" aria-live="polite">
      <header><h2 id="ptitle"></h2><small id="pmeta"></small><span class="grow"></span><button class="close" id="close">Close ✕</button></header>
      <div class="body" id="pbody"></div>
    </section>
  </main>

  <footer class="cmd">
    <form id="ask"><button type="button" class="vtag half" id="vTag" title="Spoken answers"><span class="eq2" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>VOICE</b><em id="vTagT">SPOKEN</em></button><input id="q" placeholder="Ask…" autocomplete="off" aria-label="Ask">
      <button type="button" class="chip2" id="cModel" aria-haspopup="listbox" aria-expanded="false" title="The model that answers"><span id="cModelT">…</span><small id="cModelC"></small><i>▾</i></button><button type="button" class="mic" id="mic" title="Talk (Ctrl + Space)"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button></form>
    <div class="pop" id="pop" role="listbox" hidden></div>
  </footer>
</div>
<script src="/identity.js"></script>
<script src="/md.js"></script>
<script src="/voice.js"></script>
<script src="/core.js"></script>
<script src="/speak.js"></script>
<script src="/hud.js"></script>
<script src="/hud-views.js"></script>
<script src="/hud-settings.js"></script>
</body>
</html>
