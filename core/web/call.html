<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{name} · incoming call</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/call.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0b10">
  <script>/* opened as the small window (not a call), or as the phone app: show the talk view from the first frame */
    window.PHONE = !(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.amadeus);
    if (new URLSearchParams(location.search).has("stay") || window.PHONE) document.documentElement.classList.add("stay");
    if (window.PHONE) document.documentElement.classList.add("phone");</script>
</head>
<body>
  <main class="card">
    <section id="ringing">
      <div class="ring"><img src="/logo-512.png" alt="" onerror="this.onerror=null;this.src='/icon.svg'"></div>
      <div class="caller" data-name>Amadeus</div>
      <div class="callsub">Incoming call<span class="dots"></span></div>
      <div id="count" class="count"></div>
      <div class="callbtns">
        <button id="decline" class="decline" aria-label="Decline">✕</button>
        <button id="accept" class="accept" aria-label="Accept">✆</button>
      </div>
    </section>
    <section id="talk" hidden>
      <div id="avatarPanel"><div class="stage"></div><div id="avatarSub" aria-live="polite"></div>
        <button id="voiceToggle" class="corner" type="button" title="Sound">🔇</button>
        <a id="phoneMenu" class="corner left phone-only" href="/index.html" title="Dashboard">☰</a>
        <button id="phoneNotify" class="corner left2 phone-only" type="button" title="Turn on notifications" hidden>🔔</button></div>
      <div id="list"></div>
      <div id="log" aria-live="polite"></div>
      <form id="ask" class="composer">
        <div class="box">
          <input id="askInput" placeholder="Ask Amadeus…" data-name-placeholder="Ask {name}…" autocomplete="off">
          <button id="askMic" class="ico" type="button" title="Click to talk, click again to send (or hold Ctrl+Space)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0M12 17v4m-3 0h6"/></svg></button>
          <button id="askSend" class="ico send" type="submit" title="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        </div>
      </form>
    </section>
  </main>
  <script src="/identity.js"></script>
  <script src="/md.js"></script>
  <script src="/avatar.js"></script>
  <script src="/voice.js"></script>
  <script src="/call.js"></script>
</body>
</html>
