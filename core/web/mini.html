<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{name} core</title>
<link rel="stylesheet" href="/hud.css">
<link rel="stylesheet" href="/mini.css">
<script src="/themes.js"></script>
</head>
<body class="minibody">
<div class="mini" id="mini">
  <div class="bubbles" id="bubbles"></div>
  <div class="glass" id="glass" title="Click the core for the dashboard, drag the edge to move it">
    <div class="corewrap" id="corewrap" title=""></div>
    <div class="type"><form id="tform"><input id="tin" data-name-placeholder="Type to {name}…" placeholder="Type…" autocomplete="off" aria-label="Type"></form></div>
    <div class="ctl">
      <button type="button" class="vtag half" id="vTag" title="Spoken answers"><span class="eq2" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>VOICE</b><em id="vTagT">ON</em></button>
      <span class="grow"></span>
      <button type="button" class="ib" id="kb" title="Type instead"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12"/><path d="M7 10h1M11 10h1M15 10h1M8 14h8"/></svg></button>
      <button type="button" class="ib" id="mic" title="Talk (Ctrl + Space)"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button type="button" class="ib" id="dash" title="Open the dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14"/><path d="M8 21h8"/></svg></button>
      <button type="button" class="ib" id="cls" title="Close (she pops up again when something comes in)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>
<script src="/identity.js"></script>
<script src="/voice.js"></script>
<script src="/core.js"></script>
<script src="/speak.js"></script>
<script src="/mini.js"></script>
</body>
</html>
